name: Kondicionieriuirengimas.lt FTPS

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish files to production? Leave unchecked to test FTPS and preview changes.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kondicionieriuirengimas-ftps
  cancel-in-progress: false

jobs:
  ftps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Prepare public files only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          for path in index.php aciu.php privatumo-politika.php siusti.php robots.txt sitemap.xml admin lib assets; do
            test -e "$path" || { echo "Missing required path: $path"; exit 1; }
            cp -R "$path" publish/
          done
          # Never upload server configuration, credentials or user-uploaded files.
          rm -rf publish/private publish/uploads publish/.htaccess publish/.well-known
          find publish -type f | sort

      - name: Install FTPS client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Verify FTP hostname and port 21 (no credentials sent)
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          set -euo pipefail
          if [[ -z "$FTP_HOST" ]]; then
            echo "::error::Missing FTP_SERVER secret"
            exit 1
          fi
          if [[ "$FTP_HOST" == *://* || "$FTP_HOST" == */* || "$FTP_HOST" == *:* ]]; then
            echo "::error::FTP_SERVER must contain only the FTP host (example: ftp.example.lt), without ftp://, slash or port"
            exit 1
          fi
          echo "Checking FTP_SERVER DNS (secret value hidden)..."
          if ! getent ahostsv4 "$FTP_HOST" >/dev/null; then
            echo "::error::FTP_SERVER hostname cannot be resolved. Compare it with FileZilla Quickconnect Host."
            exit 1
          fi
          echo "DNS lookup succeeded."
          echo "Checking FTP TCP port 21..."
          if ! timeout 15 bash -c 'exec 3<>/dev/tcp/$1/21' _ "$FTP_HOST"; then
            echo "::error::Cannot connect to port 21. Check actual FileZilla server address, firewall and FTP port."
            exit 1
          fi
          echo "Port 21 is reachable."

      - name: Diagnose secure FTP login and target folder (no file changes)
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$FTP_USER" || -z "$FTP_PASS" ]]; then
            echo "::error::FTP_USERNAME or FTP_PASSWORD secret is empty or missing."
            exit 1
          fi
          echo "Testing FTPS authentication, without uploading files..."
          if ! curl --ssl-reqd --silent --show-error --connect-timeout 15 --max-time 40 --user "$FTP_USER:$FTP_PASS" --list-only --output /dev/null "ftp://$FTP_HOST/"; then
            echo "::error::FTPS login failed. Inspect the curl error above: (67) credentials; (60) certificate; (7/28) connection; (64) server rejected TLS."
            exit 1
          fi
          echo "FTPS login succeeded. Checking target directory..."
          if ! curl --ssl-reqd --silent --show-error --connect-timeout 15 --max-time 40 --user "$FTP_USER:$FTP_PASS" --list-only --output /dev/null "ftp://$FTP_HOST/domains/kondicionieriuirengimas.lt/public_html/"; then
            echo "::error::Login succeeded, but target directory cannot be opened. Confirm FTP root and the directory path in FileZilla."
            exit 1
          fi
          echo "FTPS login and target directory verified; no files were changed."
      - name: Check FTPS destination and preview upload (no changes)
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASS"
          lftp -u "$FTP_USER","$FTP_PASS" -e "
            set cmd:fail-exit true;
            set net:max-retries 1;
            set net:timeout 15;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            cd /domains/kondicionieriuirengimas.lt/public_html/;
            pwd;
            mirror -R --dry-run --verbose --no-perms ./publish/ .;
            bye;
          " "ftp://$FTP_HOST"

      - name: Publish to production (manual opt-in only; no remote deletions)
        if: ${{ inputs.publish }}
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASS" -e "
            set cmd:fail-exit true;
            set net:max-retries 1;
            set net:timeout 15;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            cd /domains/kondicionieriuirengimas.lt/public_html/;
            mirror -R --verbose --no-perms ./publish/ .;
            bye;
          " "ftp://$FTP_HOST"
